[package]
name = "vaani-media"
version = "0.1.0"
edition = "2024"
rust-version = "1.92"
description = "vaani-media for VaaniDesk."
license = "MIT OR Apache-2.0"
publish = false

[dependencies]
vaani-core = { workspace = true }
vaani-inference = { workspace = true }
symphonia = { workspace = true }
rubato = { workspace = true }
rustfft = { workspace = true }
ndarray = { workspace = true }
parking_lot = { workspace = true }
crossbeam-channel = { workspace = true }
thiserror = { workspace = true }
serde = { workspace = true }
tracing = { workspace = true }

# Test-only. `tempfile` is already in `[workspace.dependencies]` at version 3, so
# this adds no new third-party crate; it is here because the integration tests
# synthesise every fixture in a temporary file and must not be able to collide
# with, or leave behind, anything on the developer's machine.
[dev-dependencies]
tempfile = { workspace = true }

[lints]
workspace = true
