[package]
name = "vaani-inference"
version = "0.1.0"
edition = "2024"
rust-version = "1.92"
description = "ONNX Runtime session management, execution-provider selection and machine capability detection for VaaniDesk."
license = "MIT OR Apache-2.0"
publish = false

[dependencies]
vaani-core = { workspace = true }
tracing = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
ort = { workspace = true }
half = { workspace = true }
windows = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_Registry",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
] }

[dev-dependencies]
tempfile = { workspace = true }

[lints]
workspace = true
