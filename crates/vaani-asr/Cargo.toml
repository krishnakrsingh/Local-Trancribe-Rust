[package]
name = "vaani-asr"
version = "0.1.0"
edition = "2024"
rust-version = "1.92"
description = "ASR engine abstraction and the SraVaani 1.0 adapter for VaaniDesk."
license = "MIT OR Apache-2.0"
publish = false

[dependencies]
vaani-core = { workspace = true }
vaani-inference = { workspace = true }
tracing = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
rustfft = { workspace = true }
sentencepiece-rs = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
# The `asr-profile` example has to reproduce production chunking, because the
# encoder's cost and the decode loop's length both depend on how the audio was
# split before it reached the engine. Measuring a whole file in one call is not
# a faster measurement, it is a different and much more expensive one.
vaani-vad = { workspace = true }

[lints]
workspace = true
